name: HotelPro Auto Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build All 5 Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create releases directory
        run: mkdir -p releases

      - name: Build Waiter POS APK
        run: |
          flutter build apk -t lib/main_waiter.dart -PtargetApp=waiter --dart-define=APP_ID=waiter --release
          cp build/app/outputs/flutter-apk/app-release.apk releases/HotelPro_WaiterPOS.apk

      - name: Build Delivery Partner APK
        run: |
          flutter build apk -t lib/main_delivery.dart -PtargetApp=delivery --dart-define=APP_ID=delivery --release
          cp build/app/outputs/flutter-apk/app-release.apk releases/HotelPro_DeliveryBoy.apk

      - name: Build Housekeeping APK
        run: |
          flutter build apk -t lib/main_housekeeping.dart -PtargetApp=housekeeping --dart-define=APP_ID=housekeeping --release
          cp build/app/outputs/flutter-apk/app-release.apk releases/HotelPro_Housekeeping.apk

      - name: Build Manager MIS APK
        run: |
          flutter build apk -t lib/main_manager.dart -PtargetApp=manager --dart-define=APP_ID=manager --release
          cp build/app/outputs/flutter-apk/app-release.apk releases/HotelPro_ManagerMIS.apk

      - name: Build Customer Dining APK
        run: |
          flutter build apk -t lib/main_customer.dart -PtargetApp=customer --dart-define=APP_ID=customer --release
          cp build/app/outputs/flutter-apk/app-release.apk releases/HotelPro_CustomerDining.apk

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotelpro-android-apks
          path: releases/*.apk

  build-windows:
    name: Build Windows Desktop ERP
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows ERP Release
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath HotelPro_Windows_ERP.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotelpro-windows-erp
          path: HotelPro_Windows_ERP.zip

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: hotelpro-android-apks
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: hotelpro-windows-erp
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
